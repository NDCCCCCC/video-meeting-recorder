# 视频会议录制系统 V2.0 配置文件
# 配置文件不存在时自动生成

server:
  host: "0.0.0.0"
  port: 8080
  environment: "production"
  read_timeout: 30
  write_timeout: 30

database:
  driver: "sqlite"
  path: "./data/record.db"
  journal_mode: "WAL"
  synchronous: "NORMAL"
  cache_size: 2000
  busy_timeout: 5000
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 3600

auth:
  sm4_secret: "EDC6UNKa5JQUrBnBsmgRww=="
  access_token_duration: "2h"
  refresh_token_duration: "168h"  # 7 days
  max_session_duration: "720h"   # 30 days
  hls_token_secret: "change-me-in-production"
  hls_token_duration: "5m"

logging:
  level: "info"
  format: "json"
  output: "logs"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

storage:
  recordings_path: "./data/recordings"
  hls_path: "./data/hls"
  temp_path: "./data/temp"
  max_disk_usage: 90
  local:
    base_path: "./data/files"
    base_url: "http://localhost:8080/files"
  max_file_size: 5368709120  # 5GB
  allowed_extensions: [".mp4", ".mkv", ".avi", ".mov", ".wmv", ".flv", ".ppt", ".pptx", ".pdf", ".doc", ".docx"]

huawei:
  conference_server: ""
  conference_port: 80
  username: ""
  password: ""
  https: true
  insecure_skip_verify: false
  api_timeout: "30s"
  session_timeout: "3600s"
  keep_alive_interval: "300s"
  min_tls_version: "1.0"

ffmpeg:
  path: "./bin/ffmpeg"  # 使用项目内置的 ffmpeg
  ffprobe_path: "./bin/ffprobe"  # 使用项目内置的 ffprobe
  max_processes: 5
  timeout: "5m"
  default_codec: "h264"
  default_format: "mp4"
  default_video_bitrate: "2000"   # 已废弃，使用 crf/max_video_bitrate
  default_audio_bitrate: "128"
  # 视频编码质量控制（CRF模式 - 推荐）
  crf: 23                         # CRF质量值：18-28，值越小质量越高。23为推荐值，可减少30-50%文件大小
  preset: "medium"                # 编码速度预设：ultrafast~veryslow。medium平衡速度与压缩率
  max_video_bitrate: "3M"         # 最大视频码率（配合CRF使用，防止码率过高）
  video_bufsize: "6M"             # 视频缓冲区大小（通常是maxrate的2倍）
  # DShow 设备配置
  dshow_buffer_size: 2097152      # 2MB 实时缓冲区
  dshow_thread_queue_size: 8      # 线程队列大小
  # HLS 配置（实时预览流）
  hls_segment_duration: 10        # HLS 分片时长（秒）
  hls_list_size: 5                # HLS 播放列表保留分片数
  # 系统会自动删除旧分片文件，仅保留最近 hls_list_size 个分片
  # 这确保长时间录制不会占用过多磁盘空间，同时保持低延迟预览
  # 录制监控配置
  max_recording_duration: "24h"   # 最长录制时长

rtsp:
  enabled: false
  max_streams: 10
  reconnect_timeout: "30s"
  buffer_size: 1048576
