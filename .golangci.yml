version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    # --- 持续生效（基线 0 告警）---
    - errcheck
    - gosec
    - govet
    - errorlint
    - misspell
    - staticcheck
    - unused
    - whitespace
    # --- 技术债 linter（历史积累告警，暂关闭，按计划逐个开启）---
    # TODO(tech-debt): 以下 linter 因 CI 此前受 golangci-lint 版本不兼容阻塞、
    # 从未真正运行过，首次基线（v2.12.2）存在历史告警。清理方法：
    #   1) 将 linter 加入上方 enable；2) `golangci-lint run` 修掉告警；3) 提交。
    # 剩余基线告警数：gocritic 20 · gocyclo 9 · prealloc 8 · cyclop 1
    # · errname 2 · ineffassign 2 · unconvert 2
    # (staticcheck、unused、errcheck、gosec 已清理开启)
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      check-type-assertions: false
      check-blank: false
    errorlint:
      errorf: true
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        - G104
        - G301  # 目录权限字面量（0o755）：Web 应用目录需可读，权限由部署决定，非代码缺陷
        - G306  # 文件权限字面量（0o644）：非敏感数据文件合理，敏感文件单独收紧
        # 以下规则对本项目（文件管理 + FFmpeg 录制/转码流水线）产生大量固有噪声，
        # critical 路径（如 slide_cache path traversal）已单独用 filepath.Rel 加固。
        # 新增文件/exec 调用时请人工复核 path traversal 与命令注入风险。
        - G304  # 文件路径包含：大量内部文件操作（录制/PPT/快照/代码生成器），路径多为内部生成或配置
        - G204  # subprocess：FFmpeg/ffprobe/python 录制转码，参数内部构建，已评估命令注入
        - G115  # 整数溢出转换：值域受限（重连次数/生命周期天数/PKCS7 padding 1-16），安全
        - G402  # TLS InsecureSkipVerify：AD 域控/华为会议连接，由 config 控制（内网常需跳过证书校验）
        - G501  # crypto/md5 import：通义听悟 OpenAPI 签名规范要求 md5
        - G401  # 弱哈希使用：同 G501，通义听悟 API 签名为外部规范要求
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      # ST1005（error string 首字母大写）对中文 error message 误报——项目 error 以
      # 中文+英文专有名词开头（如 "Python依赖..."、"Tingwu服务..."），专有名词大写正确。
      - linters: [staticcheck]
        text: 'ST1005'
      - linters:
          - cyclop
          - gocyclo
        path: _test\.go
      - linters:
          - cyclop
          - gocyclo
        path: cmd/
      - linters:
          - cyclop
        path: (.+)_test\.go
      # 测试文件 gosec 噪声：测试用的假凭据/cookie/exec/路径均非生产风险
      - linters: [gosec]
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/NDCCCCCC/video-meeting-recorder
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
