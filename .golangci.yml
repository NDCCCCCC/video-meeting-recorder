version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    # --- 持续生效（迁移到 v2.12.2 时基线 0 告警）---
    - govet
    - errorlint
    - misspell
    - whitespace
    # --- 技术债 linter（历史积累告警，暂关闭，按计划逐个开启）---
    # TODO(tech-debt): 以下 linter 因 CI 此前受 golangci-lint 版本不兼容阻塞、
    # 从未真正运行过，首次基线（v2.12.2）存在历史告警。清理方法：
    #   1) 将 linter 加入上方 enable；2) `golangci-lint run` 修掉告警；3) 提交。
    # 基线告警数：staticcheck ~20 · errcheck 135 · gosec 134 · unused 25
    # · gocritic 20 · gocyclo 9 · prealloc 8 · cyclop 1 · errname 2
    # · ineffassign 2 · unconvert 2
    # 建议开启顺序：staticcheck → errcheck → gosec → unused → 其余。
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      check-type-assertions: false
      check-blank: false
    errorlint:
      errorf: true
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        - G104
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - cyclop
          - gocyclo
        path: _test\.go
      - linters:
          - cyclop
          - gocyclo
        path: cmd/
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/NDCCCCCC/video-meeting-recorder
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
