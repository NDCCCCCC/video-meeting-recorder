# Record V2 配置文件

server:
  host: "0.0.0.0"
  port: 8080
  environment: "development"
  read_timeout: 30
  write_timeout: 30

# 数据库配置（SQLite，纯Go驱动，无需CGO）
database:
  driver: "sqlite"
  path: "./data/record.db"
  enable_wal: true
  enable_foreign_key: true
  journal_mode: "WAL"
  synchronous: "NORMAL"
  cache_size: 2000
  busy_timeout: 5000
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 0

# 认证配置
auth:
  jwt_secret: "change-me-in-production-please-use-env-variable"
  access_token_duration: "2h"
  refresh_token_duration: "168h"  # 7 days
  max_session_duration: "720h"    # 30 days

# 日志配置
logging:
  level: "debug"
  format: "console"
  output: "logs"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

# 存储配置
storage:
  recordings_path: "./data/recordings"
  temp_path: "./data/temp"
  max_disk_usage: 90
  # 文件存储配置
  local:
    base_path: "./data/files"
    base_url: "http://localhost:8080/files"
  max_file_size: 5368709120  # 5GB
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".txt"
    - ".zip"
    - ".rar"
    - ".mp4"
    - ".mkv"
    - ".avi"

# 华为会议系统配置
huawei:
  conference_server: "${HUAWEI_CONF_SERVER:10.62.10.3}"
  username: "${HUAWEI_USERNAME:admin}"
  password: "${HUAWEI_PASSWORD:}"
  https: false
  insecure_skip_verify: true

# RTSP配置
rtsp:
  enabled: true
  max_streams: 10
  reconnect_timeout: "30s"
  buffer_size: 1048576

# FFmpeg配置
ffmpeg:
  path: "ffmpeg"
  max_processes: 5
  timeout: "5m"
  default_codec: "h264"
  default_format: "mp4"
  default_video_bitrate: "2000"
  default_audio_bitrate: "128"
