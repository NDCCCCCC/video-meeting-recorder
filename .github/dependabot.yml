# NDCCCCCC/video-meeting-recorder 的 Dependabot 配置。
#
# 覆盖此仓库中的所有四个依赖表面：
# - npm (前端目录，通过 package-lock.json 锁定；CI 使用 `npm ci`)
# - 通过 uv 安装 pip (根目录 pyproject.toml + uv.lock；CI 环境不含 Python，锁定
#   在本地维护)
# - 根目录下的 gomod（go.mod 下的单个模块；CI 使用 go 1.25）
# - gomod 在 scripts/fix_migration 和 scripts/check_db 中 (独立
# 子模块，CI 通过“忽略 go.mod”在系统中忽略它们
#   临时根目录警告，但 Dependabot 仍应显示更新)
# - GitHub Actions (ci.yml 明确指定了 action 版本)
#
# 参考：
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

版本：2: 2

更新：:
  # ── 前端 (npm) ────────────────────────────────────────────────# ── Frontend (npm) ────────────────────────────────────────────────
  - package-ecosystem: "npm"package-ecosystem: "npm"
    目录: "/frontend": "/frontend"
    日程：:
      间隔: "每周": "weekly"
      day: "monday": "monday"
      时间: "09:00": "09:00"
      时区: "Asia/Shanghai": "Asia/Shanghai"
    # 与 CI 对齐：Node 20# Align with CI: Node 20
    目标分支: "main": "main"
    提交信息：:
      前缀: "chore(frontend)": "chore(frontend)"
      包含: "scope": "scope"
    # CI 使用 `npm ci`（严格锁文件），因此 PR 必须保持# CI uses `npm ci` (strict lockfile) so PRs MUST keep
    # package-lock.json 与 package.json 同步# package-lock.json in sync with package.json
    标签：:
      - "依赖项""dependencies"
      - "前端""frontend"
    # 限制噪声：跳过单体仓库范围内的变更导致的补丁级别波动# Limit noise: skip patch-level bumps for monorepo-wide churn
    # (该项目是一个单包应用，所以这主要是为了美观)# (the project is a single-package app, so this is mostly cosmetic)
    组：:
      补丁与次要：:
        适用于：版本更新: version-updates
        模式：:
          - “*”"*"
        更新类型：:
          - “次要”"minor"
          - "补丁""patch"
    # 审稿人轮换：ping 维护者# Reviewer rotation: ping maintainer
    审稿人：:
      - "NDCCCCCC""NDCCCCCC"
    # 除非带有安全标签，否则跳过主版本；用户偏好分阶段发布# Skip majors unless security-tagged; user prefers staged rollouts
    忽略：:
      - dependency-name: "*"dependency-name: "*"
        更新类型：["版本更新：semver-major"]: ["version-update:semver-major"]
    开放拉取请求限制：5: 5

  # ── Python (uv / pip) ─────────────────────────────────────────────# ── Python (uv / pip) ─────────────────────────────────────────────
  - package-ecosystem: "pip"package-ecosystem: "pip"
    目录: "/": "/"
    日程：:
      间隔: "每周": "weekly"
      day: "monday": "monday"
      时间: "09:00": "09:00"
      时区: "Asia/Shanghai": "Asia/Shanghai"
    目标分支: "main": "main"
    提交信息：:
      前缀: "chore(python)": "chore(python)"
      包含: "scope": "scope"
    标签：:
      - "依赖项""dependencies"
      - "python""python"
    # uv 在 pyproject.toml 中支持版本说明符；Dependabot# uv honors version specifiers in pyproject.toml; Dependabot
    # 自动跟随它们。Pillow >=10.0.0,<13.0.0 约束# follows them automatically. The Pillow >=10.0.0,<13.0.0 cap
    # 强制进行重大升级的手动更新。# forces a manual bump for major upgrades.
    组：:
      补丁与次要：:
        适用于：版本更新: version-updates
        模式：:
          - “*”"*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "NDCCCCCC"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  # ── Go (root module) ──────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(go)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    # Allow direct + indirect; CI runs `go mod download` only
    # (no `go mod tidy` in backend job, so reviewers MUST run
    # `go mod tidy && go generate ./internal/errors/...` locally
    # before merge — see ci.yml "Verify errors doc sync" step)
    groups:
      golang-x-and-indirect:
        applies-to: version-updates
        patterns:
          - "golang.org/x/*"
          - "github.com/spf13/*"
          - "github.com/gin-gonic/*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "NDCCCCCC"
    # Direct-dependency major bumps need manual review (API surface
    # changes, e.g. gin v1.x -> v2.x); block majors.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # ── Go (scripts/fix_migration submodule) ──────────────────────────
  - package-ecosystem: "gomod"
    directory: "/scripts/fix_migration"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(scripts)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "scripts"
    reviewers:
      - "NDCCCCCC"
    open-pull-requests-limit: 2

  # ── Go (scripts/check_db submodule) ───────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/scripts/check_db"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(scripts)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "scripts"
    reviewers:
      - "NDCCCCCC"
    open-pull-requests-limit: 2

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # golangci/golangci-lint-action is pinned to v7 + golangci-lint
    # v2.12.2 (built with go1.25); Dependabot bumps here would break
    # the matrix — see memory `project-golangci-lint-v2-pin.md`.
    reviewers:
      - "NDCCCCCC"
    # Always allow security-tagged action bumps (e.g.
    # actions/checkout, actions/setup-go CVEs) even if major.
    open-pull-requests-limit: 3
