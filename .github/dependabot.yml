# NDCCCCCC/video-meeting-recorder 的 Dependabot 配置。
#
# 覆盖四个依赖表面:
# - npm(前端目录,通过 package-lock.json 锁定;CI 使用 `npm ci`)
# - pip(根目录 pyproject.toml + uv.lock;CI 环境不含 Python,锁定在本地维护)
# - gomod(根目录 go.mod 下的单个模块;CI 使用 go 1.25)
# - gomod 在 scripts/fix_migration 和 scripts/check_db 中(独立子模块;
#   CI 通过"忽略 go.mod"在系统中忽略它们,但 Dependabot 仍会开更新 PR)
# - GitHub Actions(ci.yml 明确指定了 action 版本)
#
# 参考:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── 前端 (npm) ──────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # 与 CI 对齐:Node 24
    target-branch: "main"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    # CI 使用 `npm ci`(严格锁文件),因此 PR 必须保持 package-lock.json
    # 与 package.json 同步。
    labels:
      - "dependencies"
      - "frontend"
    # 限制噪声:把 patch+minor 合并成一个组
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # 审稿人轮换:ping 维护者
    reviewers:
      - "NDCCCCCC"
    # 跳过主版本的 version-update(用户偏好分阶段发布);但 security-update
    # 的主版本仍可开 PR(applies-to 仅作用于 version-updates)。
    ignore:
      - dependency-name: "*"
        applies-to: version-updates
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # ── Python (uv / pip) ───────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(python)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # uv 在 pyproject.toml 中支持版本说明符;Dependabot 自动跟随。
    # Pillow 上限 <13.0.0 由 pyproject.toml 约束,主版本升级需手动。
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "NDCCCCCC"
    ignore:
      - dependency-name: "*"
        applies-to: version-updates
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  # ── Go (根模块) ─────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(go)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    # CI 只跑 `go mod download`(backend job 不跑 `go mod tidy`),所以
    # 合并前 reviewers 必须本地跑 `go mod tidy && go generate ./internal/errors/...`
    # —— 见 ci.yml 的 "Verify errors doc sync" 步骤。
    groups:
      golang-x-and-indirect:
        applies-to: version-updates
        patterns:
          - "golang.org/x/*"
          - "github.com/spf13/*"
          - "github.com/gin-gonic/*"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "NDCCCCCC"
    # 直接依赖的主版本升级需手动 review(API 表面变化,如 gin v1->v2);
    # 跳过 version-update 的主版本,但允许 security 主版本开 PR。
    ignore:
      - dependency-name: "*"
        applies-to: version-updates
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # ── Go (scripts/fix_migration 子模块) ───────────────────────────
  - package-ecosystem: "gomod"
    directory: "/scripts/fix_migration"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(scripts)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "scripts"
    reviewers:
      - "NDCCCCCC"
    open-pull-requests-limit: 2

  # ── Go (scripts/check_db 子模块) ────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/scripts/check_db"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "chore(scripts)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "scripts"
    reviewers:
      - "NDCCCCCC"
    open-pull-requests-limit: 2

  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "main"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    # golangci/golangci-lint-action 锁定 v7 + golangci-lint v2.12.2
    # (go1.25 构建);Dependabot 升级这里可能破坏矩阵
    # —— 见 memory `project-golangci-lint-v2-pin.md`。
    reviewers:
      - "NDCCCCCC"
    # 始终允许带安全标签的 action 升级(如 checkout、setup-go 的 CVE),
    # 即使是主版本 —— 此处无 ignore 块。
    open-pull-requests-limit: 3
