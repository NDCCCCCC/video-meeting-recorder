name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：Go 测试 + Lint
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        working-directory: .
        run: go mod download

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: internal/frontend/dist

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o /tmp/record-v2-test ./cmd/server

      - name: Verify errors doc sync
        run: |
          go generate ./internal/errors/...
          if ! git diff --quiet docs/errors.md; then
            echo "::error::docs/errors.md is out of sync with internal/errors — run 'go generate ./internal/errors/...' and commit the result"
            git diff docs/errors.md
            exit 1
          fi

      - name: Test
        # go clean -testcache 强制清掉上一次 build 的测试结果缓存。
        # 上次观察到 audit_logs 在 services 包内出现 "no such table" 间歇性失败,
        # 推测是 test cache 命中了上一次 sqlite :memory: schema 残留。强制清缓存
        # 让所有 test 在本 job 重新编译并新建 sqlite 内存库,根除该类问题。
        run: |
          go clean -testcache
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          # 测试用环境变量（go test 不需要真实密钥）
          SM4_SECRET: 0123456789abcdef0123456789abcdef
          HLS_TOKEN_SECRET: 0123456789abcdef0123456789abcdef

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 固定到 v2.12.2：需用 go1.25 构建的 golangci-lint 才能分析 go1.25 代码。
          # v1.x / v2.7.x（go1.24 构建）会报 "Go language version ... is lower
          # than the targeted Go version (1.25.0)"。`latest` 不可控，禁用。
          # 注意：golangci-lint v2 需用 golangci-lint-action v7（v6 只支持 v1）。
          version: v2.12.2
          args: --timeout=5m

      - name: Upload coverage
        if: matrix.go-version == '1.25' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.out

  # ---------------------------------------------------------------------------
  # 后端：交叉编译矩阵（4 个目标）
  # ---------------------------------------------------------------------------
  cross-build:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: '.exe'
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Sync frontend dist for embed
        run: |
          rm -rf internal/frontend/dist
          mkdir -p internal/frontend/dist
          cp -r frontend/dist/. internal/frontend/dist/

      - name: Cross-compile ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" \
            -o bin/record-v2-${{ matrix.target }}${{ matrix.ext }} \
            ./cmd/server
          ls -lh bin/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: record-v2-${{ matrix.target }}
          path: bin/record-v2-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 前端：Lint + Type check + Build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check & build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  # ---------------------------------------------------------------------------
  # 发布：tag 触发，生成 GitHub Release（6 平台二进制 + SHA256SUMS）
  # ---------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [backend, cross-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # 创建 release 需要
    steps:
      - name: Download all cross-build binaries
        uses: actions/download-artifact@v8
        with:
          pattern: record-v2-*
          path: dist
          merge-multiple: true

      - name: List downloaded binaries
        run: |
          ls -lh dist/
          file dist/*

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release (draft)
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/record-v2-windows-amd64.exe
            dist/record-v2-windows-arm64.exe
            dist/record-v2-linux-amd64
            dist/record-v2-linux-arm64
            dist/record-v2-darwin-amd64
            dist/record-v2-darwin-arm64
            dist/SHA256SUMS

      - name: Report release URL
        if: always()
        run: |
          echo "Release URL: ${{ steps.create_release.outputs.url }}"
          echo "Release ID:  ${{ steps.create_release.outputs.id }}"
          echo "Upload URL:  ${{ steps.create_release.outputs.upload_url }}"

  # ---------------------------------------------------------------------------
  # 汇总：所有 job 成功后输出
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, cross-build, frontend]
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.cross-build.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
