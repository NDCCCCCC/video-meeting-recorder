[project]
name = "record-v2"
version = "1.0.0"
description = "Python dependencies for Record V2 video processing system"
requires-python = ">=3.8"

dependencies = [
    "python-pptx>=1.0.2,<2.0.0",
    "Pillow>=10.0.0,<13.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

# Configure hatch to not try to build anything (this is just for dependency management)
[tool.hatch.build.targets.wheel]
packages = []  # No packages to build
